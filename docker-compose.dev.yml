name: cookbook

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    command: sh -c "npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles:
      - static-web

  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

volumes:
  backend_node_modules:
