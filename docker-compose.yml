name: cookbook

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Local compose serves HTTP on :80 — Secure cookies would not stick without TLS
      COOKIE_SECURE: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-cookbook}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cookbook}?schema=public
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - cookbook

  web:
    build:
      context: .
      dockerfile: fe/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cookbook

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cookbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cookbook}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cookbook

networks:
  cookbook:
    driver: bridge

volumes:
  db-data:
